name: Build & Deploy Docusaurus

on:
  push:
    branches:
      - dev
    paths:
      - 'docs/**'
      - 'src/**'
      - 'static/**'
      - 'docusaurus.config.*'
      - 'sidebars.*'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - dev
    paths:
      - 'docs/**'
      - 'src/**'
      - 'static/**'
      - 'docusaurus.config.*'
      - 'sidebars.*'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus
        run: npm run build

      # Optional: add your own test commands here
      # - name: Run tests
      #   run: npm test

      # Only deploy on push to dev (not on pull_request)
      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build
          path: build/
          retention-days: 1

  deploy-to-release:
    name: Deploy to release branch
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only runs on push to dev (not on pull_request)
    if: github.event_name == 'push'

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          # Use a PAT if you need to push to a protected branch,
          # otherwise the default GITHUB_TOKEN works for unprotected branches.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clear old build files
        run: |
          find . -mindepth 1 -maxdepth 1 \
          -not -name '.git' \
          -not -name '.gitignore' \
          -not -name '.cpanel.yml' \
          -exec rm -rf {} +

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-build
          path: .

      - name: Commit and push to release branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit — build output is identical to release branch."
          else
            git commit -m "deploy: build from dev@${{ github.sha }}"
            git push
          fi
